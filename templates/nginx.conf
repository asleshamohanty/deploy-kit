# Copy to /etc/nginx/sites-available/<project>, symlink into sites-enabled,
# then `sudo nginx -t && sudo systemctl reload nginx`.
# Placeholders: __DOMAIN__, __WEBROOT__, __BACKEND_PORT__

server {
    listen 80;
    server_name __DOMAIN__;

    root __WEBROOT__;
    index index.html;

    # Static frontend (React/Vite build output)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API — proxied to the PM2-managed Node process
    location /api/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location = /health {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__/health;
    }
}

# After running `certbot --nginx -d __DOMAIN__`, certbot will add the
# SSL server block and redirect automatically.
